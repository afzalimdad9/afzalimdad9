name: Update README with Dynamic Content

on:
  schedule:
    - cron: '0 6,18 * * *'  # Twice a day at 6am and 6pm UTC
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install axios cheerio node-fetch @octokit/rest

      - name: Update README with dynamic content
        run: node .github/scripts/update-readme.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          GITHUB_USERNAME: afzalimdad9

      - name: Commit and push changes
        run: |
          git config --local user.email "afzalimdad9@gmail.com"
          git config --local user.name "afzalimdad9"
          git add README.md
          git diff --staged --quiet || git commit -m "🤖 Auto-update README with fresh dynamic content"
          git push

  update-blog-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install axios
        run: npm install axios
      - name: Update blog posts in README
        run: node .github/scripts/update-blog-posts.js
      - name: Commit and push changes
        run: |
          git config --local user.email "afzalimdad9@gmail.com"
          git config --local user.name "afzalimdad9"
          git add README.md
          git diff --staged --quiet || git commit -m "🤖 Update blog posts section"
          git push

  update-github-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          MAX_LINES: 10

  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: afzalimdad9
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}